name: Bump version

# Runs after CI finishes on main. Only bumps when CI passed and the commit
# that triggered it isn't itself a previous bump (avoids looping).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: Bump version and changelog
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'bump:')
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install commitizen
        run: pipx install commitizen

      - name: Bump version and update changelog
        id: bump
        run: |
          before="$(git rev-parse HEAD)"
          if cz bump --changelog --yes; then
            after="$(git rev-parse HEAD)"
            if [ "$before" != "$after" ]; then
              echo "bumped=true" >> "$GITHUB_OUTPUT"
              echo "version=$(cz version --project)" >> "$GITHUB_OUTPUT"
            else
              echo "bumped=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No eligible commits to bump."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push commit and tag
        # cz creates a lightweight tag, which --follow-tags won't push.
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Extract this version's changelog section
        if: steps.bump.outputs.bumped == 'true'
        run: awk '/^## /{if (p) exit; p=1} p' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --notes-file /tmp/release-notes.md

name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('manifest.json')); print('manifest.json is valid JSON')"

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: >-
            .git

      - name: Install QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: Lint QML files
        run: |
          QMLLINT="$(command -v qmllint || find /usr/lib/qt6 -type f -name qmllint | head -n1)"
          if [ -z "$QMLLINT" ]; then
            echo "qmllint not found after install" >&2
            exit 1
          fi
          echo "Using $QMLLINT"
          # This plugin's qs.Commons/qs.Ui imports only resolve inside a real
          # Omarchy/Quickshell install, which isn't available here — so import
          # resolution and everything that cascades from it (unqualified
          # access, unresolved/missing types, required-property checks on
          # types qmllint couldn't resolve, Process's onExited signature) are
          # disabled. That still leaves qmllint doing real syntax validation:
          # a genuinely malformed file fails with a `[syntax]` error and a
          # non-zero exit regardless of these flags.
          find . -name '*.qml' -not -path './.git/*' -print0 | xargs -0 "$QMLLINT" \
            --import disable \
            --unqualified disable \
            --unresolved-type disable \
            --missing-property disable \
            --missing-type disable \
            --required disable \
            --signal-handler-parameters disable
